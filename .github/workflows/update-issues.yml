name: "Update Good First Issues"

on:
  schedule:
    - cron: '15 20 * * *'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-issues:
    if: "!contains(github.event.head_commit.message, 'chore: update good first issues')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate good first issues CSV
        uses: ./
        with:
          usernames: ${{ secrets.USERNAMES }}
          github-token: ${{ github.token }}
          output-path: good_first_issues.csv

      - name: Render README
        run: |
          python -m app.render_readme \
            --input good_first_issues.csv

      - name: Upload CSV artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: good-first-issues
          path: good_first_issues.csv

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md good_first_issues.csv

          git diff --staged --quiet || git commit -m "chore: update good first issues [skip ci]"

          git push origin main
